name: Sync and publish

on:
  schedule:
    # Every 20 minutes, off the hour: GitHub delays or drops scheduled runs
    # under load, and the top of the hour is the busiest. Still best effort.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "examples/**"]

permissions:
  contents: read

# One run at a time; a queued run picks up the latest state.
concurrency:
  group: pr-desk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate pr-desk.config.json
        run: npm run check-config

      - id: pages
        uses: actions/configure-pages@v6

      # Conflict tracking and the merged-PR history are carried from one run to
      # the next through the published site itself, so there's no extra storage
      # to set up. Missing on the first run, which then backfills the history.
      - name: Restore previous state from the live site
        run: |
          mkdir -p public/data
          for f in state.json history.json; do
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/$f" -o "public/data/$f" \
              || echo "No previous $f (first run?)"
          done

      - name: Sync pull requests
        run: npm run sync
        env:
          # The built-in token reads any public repo. Add a PR_DESK_TOKEN secret
          # (a fine-grained PAT with read access) only to track private repos.
          GITHUB_TOKEN: ${{ secrets.PR_DESK_TOKEN || github.token }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub disables scheduled workflows in public repos after 60 days without
  # activity. If nothing has been committed for 50 days, push an empty commit.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep the scheduled sync alive"
            git push
          fi
